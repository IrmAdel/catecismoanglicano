</div>

<!-- BOTÃO VOLTAR AO TOPO -->
<button id="backToTop" title="Voltar ao topo">
  ↑
</button>

<script>
  // ===== TEMA CLARO/ESCURO COM PERSISTÊNCIA =====
  const toggleBtn = document.getElementById('toggleTheme');
  const body = document.body;

  // Função para aplicar o tema
  function applyTheme(isDark) {
    if (isDark) {
      body.classList.add('dark-mode');
      toggleBtn.textContent = '☀️';
    } else {
      body.classList.remove('dark-mode');
      toggleBtn.textContent = '🌙';
    }
    localStorage.setItem('catecismo-dark-mode', isDark ? 'true' : 'false');
  }

  // Carregar o tema salvo ao iniciar
  function loadTheme() {
    const saved = localStorage.getItem('catecismo-dark-mode');
    // Se não houver preferência salva, usar o modo claro por padrão
    if (saved === null) {
      applyTheme(false);
      return;
    }
    const isDark = saved === 'true';
    applyTheme(isDark);
  }

  // Alternar o tema ao clicar no botão
  toggleBtn.addEventListener('click', function() {
    const isDark = body.classList.contains('dark-mode');
    applyTheme(!isDark);
  });

  // Carregar o tema quando a página carregar
  loadTheme();

// ===== SISTEMA DE PESQUISA =====
const searchInput = document.getElementById('searchInput');
const book = document.getElementById('book');

// Criar elemento para mensagem de nenhum resultado
const noResults = document.createElement('div');
noResults.id = 'noResults';
noResults.innerHTML = '<p>🔍 Nenhum resultado encontrado para "<span id="searchTerm"></span>"</p>';
noResults.style.display = 'none';
book.appendChild(noResults);

// Função para limpar highlights anteriores
function clearHighlights() {
  document.querySelectorAll('.search-highlight').forEach(el => {
    const parent = el.parentNode;
    const text = el.textContent;
    const textNode = document.createTextNode(text);
    parent.replaceChild(textNode, el);
    parent.normalize();
  });
}

// Função principal de pesquisa
function performSearch() {
  const term = searchInput.value.trim().toLowerCase();
  document.getElementById('searchTerm').textContent = term;

  // Se a busca estiver vazia, resetar
  if (term === '') {
    resetSearch();
    return;
  }

  // Limpar highlights anteriores
  clearHighlights();

  // Selecionar todos os elementos que contêm texto pesquisável
  const elements = document.querySelectorAll('.qa, .prayer-card, .chapter, .section, p, li, .prayer, h3, h4, .prayer-content, .prayer-latin, .prayer-portuguese');
  let found = 0;
  let firstMatch = null;

  elements.forEach(el => {
    // Verificar se o elemento tem texto
    const text = el.textContent.toLowerCase();
    const match = text.includes(term);

    if (match) {
      el.classList.remove('search-hidden');
      found++;
      
      // Destacar o termo no elemento
      highlightText(el, term);
      
      // Guardar o primeiro elemento encontrado para scroll
      if (!firstMatch) {
        firstMatch = el;
      }
    } else {
      el.classList.add('search-hidden');
    }
  });

  // Mostrar/esconder mensagem de nenhum resultado
  if (found === 0) {
    noResults.style.display = 'block';
  } else {
    noResults.style.display = 'none';
    // Scroll para o primeiro resultado
    if (firstMatch) {
      firstMatch.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

// Função para destacar o termo em um elemento
function highlightText(el, term) {
  // Percorrer apenas os nós de texto diretos do elemento
  const walker = document.createTreeWalker(
    el,
    NodeFilter.SHOW_TEXT,
    {
      acceptNode: function(node) {
        // Ignorar nós que já estão dentro de um highlight
        if (node.parentElement.classList.contains('search-highlight')) {
          return NodeFilter.FILTER_REJECT;
        }
        // Ignorar nós vazios ou com apenas espaços
        if (!node.textContent.trim()) {
          return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    }
  );

  const textNodes = [];
  let node;
  while (node = walker.nextNode()) {
    textNodes.push(node);
  }

  // Processar cada nó de texto
  textNodes.forEach(node => {
    const text = node.textContent;
    const lowerText = text.toLowerCase();
    let index = lowerText.indexOf(term);
    
    if (index !== -1) {
      const fragment = document.createDocumentFragment();
      let lastIndex = 0;
      
      while (index !== -1) {
        // Texto antes do termo
        if (index > lastIndex) {
          fragment.appendChild(document.createTextNode(text.substring(lastIndex, index)));
        }
        
        // O termo destacado
        const highlight = document.createElement('span');
        highlight.className = 'search-highlight';
        highlight.textContent = text.substring(index, index + term.length);
        fragment.appendChild(highlight);
        
        lastIndex = index + term.length;
        index = lowerText.indexOf(term, lastIndex);
      }
      
      // Texto após o último termo
      if (lastIndex < text.length) {
        fragment.appendChild(document.createTextNode(text.substring(lastIndex)));
      }
      
      // Substituir o nó original pelo fragmento
      node.parentNode.replaceChild(fragment, node);
    }
  });
}

// Função para resetar a pesquisa
function resetSearch() {
  // Limpar highlights
  clearHighlights();
  
  // Mostrar todos os elementos
  document.querySelectorAll('.qa, .prayer-card, .chapter, .section, p, li, .prayer, h3, h4, .prayer-content, .prayer-latin, .prayer-portuguese').forEach(el => {
    el.classList.remove('search-hidden');
  });
  
  // Esconder mensagem de nenhum resultado
  noResults.style.display = 'none';
}

// Event listeners
searchInput.addEventListener('input', performSearch);
searchInput.addEventListener('search', function() {
  if (this.value === '') {
    resetSearch();
  }
});

// ===== BOTÃO VOLTAR AO TOPO =====
const backToTopBtn = document.getElementById('backToTop');

// Mostrar/esconder o botão conforme a rolagem
window.addEventListener('scroll', function() {
  if (window.scrollY > 300) {
    backToTopBtn.classList.add('show');
  } else {
    backToTopBtn.classList.remove('show');
  }
});

// Voltar ao topo com animação suave
backToTopBtn.addEventListener('click', function() {
  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
});
</script>

</body>
</html>
